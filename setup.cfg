# Helper file to handle all configs

[coverage:run]
# .coveragerc to control coverage.py and pytest-cov
omit =
    # Omit the tests
    */tests/*
    # Omit generated versioneer
    open3SPN2/_version.py

[yapf]
# YAPF, in .style.yapf files this shows up as "[style]" header
COLUMN_LIMIT = 119
INDENT_WIDTH = 4
USE_TABS = False

[flake8]
# Flake8, PyFlakes, etc
max-line-length = 119

[versioneer]
# Automatic version numbering scheme
VCS = git
style = pep440
versionfile_source = open3SPN2/_version.py
versionfile_build = open3SPN2/_version.py
tag_prefix = ''

[aliases]
test = pytest

[tool:pytest]
# Deprecations raised by open3SPN2 code fail the tests, so they are fixed before the dependency drops the old API
filterwarnings =
    error::DeprecationWarning:open3SPN2
    error::FutureWarning:open3SPN2
